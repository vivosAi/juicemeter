[workspace]
resolver = "2"
members = ["crates/juicemeter-core", "crates/juicemeter-cli", "crates/juicemeter-agent", "crates/juicemeter-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
juicemeter-core = { path = "crates/juicemeter-core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs"] }
